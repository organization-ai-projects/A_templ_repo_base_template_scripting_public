name: Automation - Sync main to dev

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync-main-to-dev:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SYNC_BRANCH: sync/main-into-dev
      SOURCE_BRANCH: main
      TARGET_BRANCH: dev

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout automation repository
        uses: actions/checkout@v4
        with:
          repository: organization-ai-projects/A_templ_repo_base_template_scripting_public
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: .automation

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create or update sync branch
        working-directory: .automation
        env:
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: cargo run -- automation sync-branch --repo "${{ github.repository }}" --source-branch "${SOURCE_BRANCH}" --sync-branch "${SYNC_BRANCH}"

      - name: Create sync pull request if missing
        working-directory: .automation
        env:
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: cargo run -- automation sync-pull-request --repo "${{ github.repository }}" --source-branch "${SOURCE_BRANCH}" --target-branch "${TARGET_BRANCH}" --sync-branch "${SYNC_BRANCH}"

      - name: Apply labels and merge sync pull request
        working-directory: .automation
        env:
          APP_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: cargo run -- automation merge-sync-pull-request --repo "${{ github.repository }}" --pr-number "${PR_NUMBER}"
